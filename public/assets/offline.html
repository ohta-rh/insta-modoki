<title>オフラインです - Mado</title>
<style>

  h1 { margin: 0; font-size: 1.5rem; }
  p { margin: 0; line-height: 1.6; }
  button {
    min-width: 44px; min-height: 44px; padding: 0 24px; border: 0; border-radius: 8px;
    background: #4f46c8; color: #ffffff; font: inherit; font-weight: 600; cursor: pointer;
  }
  button:focus-visible { outline: 2px solid #000000; outline-offset: 2px; }
  footer { max-width: 28rem; font-size: 0.875rem; color: #4d4d4d; line-height: 1.5; }

</html>
