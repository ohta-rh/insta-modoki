# CI: runs the same steps as the local gate; E2E runs apart as a 4-way shard matrix (ADR-0009, ADR-0027, ADR-0068).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose up -d --wait
      - run: node scripts/slot.mjs prepare 0
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/verify.mjs --skip e2e
        env:
          PORT: 3100
          SLOT_INT: 1
          SLOT_INT_A: '3'
          SLOT_INT_B: '4'
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

  # E2E, split four ways so it runs beside verify (ADR-0068). The seed project runs once, in the last shard.
  e2e:
    name: e2e (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose up -d --wait
      - run: node scripts/slot.mjs prepare 0
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm e2e --project chromium --shard ${{ matrix.shard }}/4
        env:
          PORT: 3100
      - if: matrix.shard == 4
        run: pnpm e2e --project seed --no-deps
        env:
          PORT: 3100
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report
          if-no-files-found: ignore

  # Performance budget (ADR-0046): slow, so only after a merge to main, never for a pull request.
  perf:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose up -d --wait
      - run: node scripts/slot.mjs prepare 0
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      # The demo password is made here, for this run only; it is never written to the repository.
      - run: echo "SEED_DEMO_PASSWORD=$(openssl rand -hex 8)" >> "$GITHUB_ENV"
      - run: pnpm seed:bench
      - run: node scripts/verify.mjs --only perf --with-perf
        env:
          PORT: 3100
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-results
          path: perf-results
          if-no-files-found: ignore
